name: Scraper health alert

on:
  schedule:
    - cron: "0 * * * *"

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Call scraper alert endpoint
        run: |
          curl --fail -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://tunehunter.app/api/cron/scraper-alert"
